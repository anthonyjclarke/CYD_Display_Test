; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = cyd28

[env]
; Pinned for reproducible release builds (Arduino core 2.0.17, as the other CYD
; installer projects). Unpinned resolves to pioarduino 3.x.
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  tzapu/WiFiManager @ ^2.0.17
  https://github.com/PaulStoffregen/XPT2046_Touchscreen
monitor_speed = 115200
; Standard CYD dual-OTA layout – frozen once released (cyd-web-installer).
board_build.partitions = partitions_custom.csv
; Writes flash_parts.json + firmware-merged.bin for the web installer.
extra_scripts = post:tools/merge_bin.py
build_flags =
  -include include/config.h

[env:cyd28]
custom_installer_label = CYD 2.8″ – ESP32-2432S028R
custom_installer_hint  = The classic Cheap Yellow Display: 2.8″ 320×240 screen.
build_flags =
  ${env.build_flags}
  -D CYD_BOARD_28

[env:cyd40]
custom_installer_label = CYD 4.0″ – ESP32-32E
custom_installer_hint  = 4.0″ 480×320 screen (ST7796S).
build_flags =
  ${env.build_flags}
  -D CYD_BOARD_40
